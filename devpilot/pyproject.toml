[project]
name = "devpilot"
version = "0.1.0"
description = "Local multi-agent CLI software engineering assistant powered by Ollama"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "textual>=0.60.0",
]

[project.scripts]
devpilot = "tui.app:run"
devpilot-cli = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["agents", "commands", "core", "ui", "tui", "tui.screens", "tui.widgets", "config", "workspace", "skills", "utils"]

